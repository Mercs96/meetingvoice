# GitHub Actions Workflow: compila el APK de MeetingVoice TWA en la nube
# Sin instalar Android Studio ni SDK en tu PC. Solo necesitas cuenta de GitHub (gratis).
#
# Cómo usarlo:
# 1. Sube el proyecto MeetingVoice-TWA a un repositorio de GitHub (público o privado)
# 2. Edita AndroidManifest.xml con tu URL real (https://tu-dominio.com)
# 3. Sube los cambios: git push
# 4. Ve a la pestaña "Actions" de tu repo en GitHub
# 5. Verás el workflow "Build APK (TWA)" ejecutándose
# 6. Cuando termine (~10 min), descarga el APK desde el "artifact" llamado "meetingvoice-apk"
#
# Para firmar el APK (necesario para distribuir):
# - Genera un keystore localmente: keytool -genkey -v -keystore meetingvoice.jks -keyalg RSA -keysize 2048 -validity 10000 -alias meetingvoice
# - Codifícalo en base64 (Linux/Mac): base64 meetingvoice.jks > keystore-base64.txt
# - En tu repo de GitHub: Settings → Secrets and variables → Actions → New secret
#   - Nombre: KEYSTORE_BASE64
#   - Valor: contenido de keystore-base64.txt
#   - Nombre: KEYSTORE_PASSWORD → contraseña del keystore
#   - Nombre: KEY_ALIAS → meetingvoice (o el que pusiste)
#   - Nombre: KEY_PASSWORD → contraseña de la clave
# - Vuelve a hacer push. El próximo APK estará firmado y listo para instalar en cualquier móvil.

name: Build APK (TWA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permite ejecutarlo manualmente

jobs:
  build:
    name: Build TWA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 'android-34'
          sdk-build-tools: '34.0.0'

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Decodificar keystore (si está configurado)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/meetingvoice.jks
          echo "Keystore decodificado correctamente."

      - name: Compilar APK de debug (sin keystore configurado)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: ./gradlew assembleDebug

      - name: Compilar APK de release firmado (con keystore configurado)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: app/meetingvoice.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Inyectar configuración de firma en build.gradle.kts temporalmente
          sed -i.bak '/buildTypes {/i\
              signingConfigs {\
                  create("release") {\
                      storeFile = file(System.getenv("KEYSTORE_PATH"))\
                      storePassword = System.getenv("KEYSTORE_PASSWORD")\
                      keyAlias = System.getenv("KEY_ALIAS")\
                      keyPassword = System.getenv("KEY_PASSWORD")\
                  }\
              }' app/build.gradle.kts
          # Configurar release para usar signingConfig
          sed -i 's/isMinifyEnabled = false/isMinifyEnabled = false\n            signingConfig = signingConfigs.getByName("release")/' app/build.gradle.kts
          ./gradlew assembleRelease

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetingvoice-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Mostrar resumen
        run: |
          echo "## Build completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descarga el APK desde la sección 'Artifacts' arriba ↑" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/release/*.apk ]; then
            echo "✅ APK firmado (release) generado correctamente." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ APK de debug generado (sin firmar). Configura los secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD para generar un APK firmado distribuible." >> $GITHUB_STEP_SUMMARY
          fi
