# Project-wide Gradle settings.

# JVM arguments para el demonio de Gradle (mejor rendimiento de build).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Usar AndroidX (obligatorio para apps modernas)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# No incremental por defecto (más estable)
android.nonTransitiveRClass=true

# Versión de NDK (si hace falta, normally no se toca)
android.suppressUnsupportedCompileSdk=34
